name: Bug report
description: Report a reproducible problem in Infra Rewind
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove credentials and production-sensitive infrastructure details before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      description: For example, v0.1.0 or a commit SHA.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest synthetic input and exact commands or interface steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and Node.js version when relevant.
    validations:
      required: true
